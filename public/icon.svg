<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011b15" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Mosque Dome and Minaret Silhouette -->
  <path d="M256 100 C235 150 170 190 170 260 L342 260 C342 190 277 150 256 100 Z" fill="url(#emerald)" opacity="0.35" />
  <circle cx="256" cy="85" r="8" fill="url(#gold)" />
  <path d="M256 70 L256 95" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />

  <!-- Crescent Moon Symbol with Glow -->
  <path d="M256 120 A 70 70 0 1 0 340 230 A 55 55 0 1 1 256 120 Z" fill="url(#gold)" filter="url(#glow)" />
  <!-- Small Star -->
  <polygon points="310,150 314,162 327,162 316,170 320,182 310,174 300,182 304,170 293,162 306,162" fill="url(#gold)" />

  <!-- Open Holy Quran Book Foundation -->
  <g transform="translate(116, 275)">
    <!-- Book Stand (Rihal) Base -->
    <path d="M40 145 L140 75 L240 145 L200 155 L140 105 L80 155 Z" fill="url(#gold)" opacity="0.8" />
    <!-- Book Spine & Pages -->
    <path d="M20 70 Q 75 40 140 60 Q 205 40 260 70 L260 105 Q 205 75 140 95 Q 75 75 20 105 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />
    <path d="M25 74 Q 75 47 138 64 L138 92 Q 75 74 25 98 Z" fill="#f8fafc" />
    <path d="M255 74 Q 205 47 142 64 L142 92 Q 205 74 255 98 Z" fill="#f8fafc" />
    <!-- Page text lines simulation -->
    <path d="M45 77 Q 85 60 125 72 M45 84 Q 85 67 125 79" stroke="#047857" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M155 72 Q 195 60 235 77 M155 79 Q 195 67 235 84" stroke="#047857" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Typography Brand -->
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="4">
    i<tspan fill="url(#gold)">GUIDE</tspan>
  </text>
  <text x="256" y="492" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="16" fill="#34d399" letter-spacing="2">
    QURAN &amp; MOSQUES
  </text>
</svg>
